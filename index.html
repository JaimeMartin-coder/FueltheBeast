<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel the Beast: Food Label Challenge</title>
<style>
:root{
  --spruce:#1d3b34; --snow:#f4f7f5; --ember:#e0612a; --sun:#f3b73a; --leaf:#2f7d46; --berry:#8e3b63;
  --ink:#15211e; --sky:#d3e8ee; --line:#c9d6d1; --card:#ffffff; --mute:#4d5f59;
  --fat:#fff0c2; --fatInk:#6b4b00; --carb:#dcf0e0; --carbInk:#17512c; --pro:#f6dcea; --proInk:#7a2a52;
  --nuc:#e3e0f5; --nucInk:#40377a;
  --good:#17512c; --goodBg:#e3f4e7; --bad:#8a2b12; --badBg:#fdebe4;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--snow);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.ico{width:56px;height:56px;display:block}

/* header */
.top{background:var(--spruce);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px}
.brand b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:1.3rem}
.prog{min-width:220px;flex:1;max-width:420px}
.prog small{display:block;color:#cfe3dc;font-size:.82rem;margin-bottom:3px}
.bar{height:10px;border-radius:6px;background:#2f574d;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .4s}

main{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.row2{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:20px;align-items:start}
@media(max-width:760px){.row2{grid-template-columns:1fr}}

/* hero */
.hero{background:var(--spruce);color:#fff;border-radius:18px;padding:26px 22px;margin-bottom:20px}
.hero p{color:#dcebe6;max-width:60ch}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.who{background:#fff;color:var(--ink);border-radius:14px;padding:10px;text-align:center}
.who .pic{background:var(--sky);border-radius:50%;width:104px;height:104px;margin:0 auto 6px;overflow:hidden}
.who .pic svg{width:100%;height:100%}
.who b{display:block;font-size:.98rem}
.who span{font-size:.86rem;color:var(--mute);display:block;line-height:1.3}
.startrow{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:20px}
.field label{display:block;font-size:.85rem;color:#cfe3dc}
.field input{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid #4b7266;background:#fff;color:var(--ink);width:150px}
.note{font-size:.84rem;color:#b9d3ca;margin-top:8px}

.btn{background:var(--ember);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#fff;color:var(--spruce);border:2px solid var(--spruce)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:.9rem}
.ghost:hover{border-color:var(--spruce)}

/* stage map */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stage{display:flex;flex-direction:column;gap:8px}
.stage .tag{align-self:flex-start;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--sky)}
.stage.done .tag{background:var(--goodBg);color:var(--good)}
.stage p{color:var(--mute);margin:0;flex:1}
.stage svg.ico{width:64px;height:64px}
.iconrow{display:flex;gap:6px}

/* nutrition label */
.nf{background:#fff;color:#000;border:2px solid #000;padding:6px 9px 8px;font-family:"Helvetica Neue",Arial,sans-serif;max-width:310px;width:100%;font-size:.93rem;line-height:1.3}
.nf h4{font-size:1.85rem;font-weight:900;margin:0;line-height:1;letter-spacing:-.5px;padding-bottom:2px;border-bottom:1px solid #000}
.nf .sv{padding:3px 0;border-bottom:1px solid #000}
.nf .cal{display:flex;justify-content:space-between;align-items:flex-end;border-top:8px solid #000;border-bottom:4px solid #000;padding:2px 0}
.nf .cal span{font-weight:900;font-size:1.25rem}
.nf .cal b{font-size:2rem;font-weight:900;line-height:1}
.nf .r{display:flex;justify-content:space-between;border-top:1px solid #000;padding:2px 4px;gap:8px}
.nf .r.sub{padding-left:22px}
.nf .r.ital span:first-child{font-style:italic}
.nf .r b{font-weight:800}
.nf .r.mac.fat{background:var(--fat)} .nf .r.mac.carb{background:var(--carb)} .nf .r.mac.pro{background:var(--pro)}
.nf .r.det{background:#e6f1f5}
.nf .r.click{cursor:pointer}
.nf .r.click:hover{outline:3px solid var(--ember);outline-offset:-3px}
.nf .r.picked{outline:3px solid var(--ember);outline-offset:-3px}
.nf .r.wrong{background:var(--badBg)}
.nf .r.right{outline:3px solid var(--leaf);outline-offset:-3px}
.nf .fine{font-size:.74rem;border-top:4px solid #000;margin-top:3px;padding-top:3px}
.foodhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.foodhead .ico{width:54px;height:54px}
.foodhead b{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-size:1.1rem;line-height:1.15}
.foodhead small{display:block;color:var(--mute);font-size:.82rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;font-size:.82rem}
.legend span{padding:1px 8px;border-radius:12px;border:1px solid #0003}
.legend .fat{background:var(--fat)} .legend .carb{background:var(--carb)} .legend .pro{background:var(--pro)} .legend .det{background:#e6f1f5}

/* question panel */
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--spruce)}
.opt small{display:block;color:var(--mute);font-size:.84rem;font-weight:400}
.opt b{font-size:1.02rem}
.opt.fat{border-left:10px solid var(--sun)} .opt.carb{border-left:10px solid var(--leaf)} .opt.pro{border-left:10px solid var(--berry)} .opt.nuc{border-left:10px solid #6a5acd}
.opt.plain{border-left:2px solid var(--line)}
.opt.no{background:var(--badBg);border-color:#e3a58f;color:#6a2210;opacity:.8}
.opt.yes{background:var(--goodBg);border-color:var(--leaf)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.good{background:var(--goodBg);color:#10381f;border:2px solid #9bd3a9}
.fb.bad{background:var(--badBg);color:#5a1d0c;border:2px solid #efb7a4}
.fb.info{background:#e7f2f6;color:#0f3340;border:2px solid #b5d6e0}
.fb b{font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.numin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin input{font:inherit;font-size:1.2rem;width:130px;padding:8px 10px;border:2px solid var(--line);border-radius:10px}
.numin span{font-weight:700}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:12px 0}
.pickcard{background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pickcard.no{border-color:#e3a58f;background:#fff8f5}
.pickcard.yes{border-color:var(--leaf);background:#f3fbf5}
.pickcard .foodhead{align-self:stretch}
.pickcard .btn{width:100%}
.letter{background:var(--spruce);color:#fff;border-radius:8px;padding:0 9px;font-weight:800;font-family:Rockwell,Georgia,serif}

.client{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--sky);border-radius:16px;padding:14px;margin-bottom:16px}
.client .pic{background:#fff;border-radius:50%;width:150px;height:150px;overflow:hidden}
.client .pic svg{width:100%;height:100%}
.client p{margin:0 0 6px}
.client h2{margin-bottom:.15em}
@media(max-width:560px){.client{grid-template-columns:1fr;text-align:center}.client .pic{margin:0 auto}}
.stepline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stepline span{font-size:.88rem;font-weight:700;padding:3px 12px;border-radius:20px;background:#e8eeeb;color:var(--mute)}
.stepline span.on{background:var(--spruce);color:#fff}
.stepline span.ok{background:var(--goodBg);color:var(--good)}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat big{display:block;font-family:Rockwell,Georgia,serif;font-size:2.1rem;line-height:1.1}
.rank{background:var(--spruce);color:#fff;border-radius:16px;padding:20px;text-align:center}
.rank .pic{width:130px;height:130px;margin:0 auto 6px;background:#fff;border-radius:50%;overflow:hidden}
.rank .pic svg{width:100%;height:100%}

#tip{position:fixed;z-index:50;max-width:280px;background:var(--ink);color:#fff;padding:9px 12px;border-radius:10px;font-size:.92rem;line-height:1.35;display:none;box-shadow:0 4px 14px #0004}
#tip b{color:var(--sun)}
.hint{font-size:.88rem;color:var(--mute);margin-top:22px;text-align:center}
.sr{position:absolute;left:-9999px}
@media print{.top,.tools,.btn,.ghost,.hint{display:none!important}}

/* calculator */
#calcBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--spruce);color:#fff;border:3px solid #fff;border-radius:30px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px #0004;display:flex;align-items:center;gap:8px}
#calcBtn svg{width:22px;height:22px}
#calc{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:41;width:272px;max-width:calc(100vw - 28px);background:#fff;border:3px solid var(--spruce);border-radius:16px;padding:10px;box-shadow:0 8px 26px #0005;display:none}
#calc.open{display:block}
#calc .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:Rockwell,Georgia,serif;font-weight:700}
#calc .ch button{background:transparent;border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.9rem}
#cdisp{background:#eef3f1;border:2px solid var(--line);border-radius:10px;padding:6px 12px;text-align:right;font-size:1.9rem;font-weight:700;min-height:54px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
#cexp{font-size:.8rem;color:var(--mute);text-align:right;min-height:1.2em;margin:4px 4px 2px}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
#calc .keys button{font-size:1.25rem;font-weight:700;padding:11px 0;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
#calc .keys button:hover{border-color:var(--spruce)}
#calc .keys .op{background:var(--sky)} #calc .keys .eq{background:var(--ember);color:#fff;border-color:var(--ember)} #calc .keys .cl{background:var(--badBg)}
@media print{#calcBtn,#calc{display:none!important}}

.showteacher{background:var(--ember);color:#fff;border:4px solid var(--ink);border-radius:14px;text-align:center;font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:900;font-size:clamp(1.5rem,5vw,2.6rem);letter-spacing:1px;padding:16px 10px;margin-bottom:16px}
#glitter{position:fixed;inset:0;z-index:79;pointer-events:none;width:100%;height:100%}
</style>
</head>

/* ===================== EFFECTS: red flash + glitter ===================== */
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastPt = {x: window.innerWidth/2, y: window.innerHeight*0.6};
document.addEventListener('click', e=>{ if(e.clientX||e.clientY) lastPt={x:e.clientX,y:e.clientY}; }, true);
document.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ const t=e.target&&e.target.getBoundingClientRect?e.target.getBoundingClientRect():null; if(t&&t.width) lastPt={x:t.left+t.width/2,y:t.top+t.height/2}; } }, true);
const gc = document.getElementById('glitter'), gx = gc.getContext('2d');
let parts = [], gAnim = null;
function sizeCanvas(){ const d=window.devicePixelRatio||1; gc.width=window.innerWidth*d; gc.height=window.innerHeight*d; gx.setTransform(d,0,0,d,0,0); }
sizeCanvas(); window.addEventListener('resize', sizeCanvas);
function celebrate(){
  const colors=['#f3b73a','#ffd966','#ff7eb6','#7ee0ff','#ffffff','#b28dff','#7cf5a2','#e0612a'];
  const n=reduceMotion?70:150;
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.9;   // spray upward in a wide cone
    const sp = 5 + Math.random()*11;
    parts.push({x:lastPt.x, y:lastPt.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      g:0.22+Math.random()*0.12, r:1.5+Math.random()*3.2, c:colors[(Math.random()*colors.length)|0],
      rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.4, life:0, max:60+Math.random()*50, star:Math.random()<0.35});
  }
  if(!gAnim) gAnim=requestAnimationFrame(stepGlitter);
}
function stepGlitter(){
  gx.clearRect(0,0,window.innerWidth,window.innerHeight);
  parts = parts.filter(p=>p.life<p.max && p.y<window.innerHeight+20);
  parts.forEach(p=>{
    p.life++; p.vy+=p.g; p.vx*=0.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    const fade = 1-p.life/p.max, tw = 0.6+0.4*Math.sin(p.life*0.7+p.rot);
    gx.save(); gx.globalAlpha=Math.max(0,fade)*tw; gx.translate(p.x,p.y); gx.rotate(p.rot); gx.fillStyle=p.c;
    if(p.star){ gx.beginPath(); for(let k=0;k<4;k++){ gx.lineTo(0,-p.r*2.2); gx.rotate(Math.PI/4); gx.lineTo(0,-p.r*0.6); gx.rotate(Math.PI/4);} gx.closePath(); gx.fill(); }
    else gx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
    gx.restore();
  });
  if(parts.length){ gAnim=requestAnimationFrame(stepGlitter); } else { gAnim=null; gx.clearRect(0,0,window.innerWidth,window.innerHeight); }
}

/* ===================== NUTRITION LABEL ===================== */
function labelHTML(key, o={}){
  const f = F[key];
  const mode = o.mode || 'macro';           // 'macro' | 'detail' | 'plain'
  const click = o.click || [];
  const st = o.state || {};                  // {picked:'fat', right:'carb', wrong:['fat']}
  const R = [
    {k:'fat', t:'Total Fat', v:fmt(f.fat)+'g', m:'fat'},
    {k:'sat', t:'Saturated Fat', v:fmt(f.sat)+'g', sub:1, d:1},
    {k:'trans', t:'Trans Fat', v:fmt(f.trans)+'g', sub:1, ital:1, d:1},
    {k:'chol', t:'Cholesterol', v:fmt(f.chol)+'mg', d:1},
    {k:'sod', t:'Sodium', v:fmt(f.sod)+'mg', d:1},
    {k:'carb', t:'Total Carbohydrate', v:fmt(f.carb)+'g', m:'carb'},
    {k:'fib', t:'Dietary Fiber', v:fmt(f.fib)+'g', sub:1, d:1},
    {k:'sug', t:'Total Sugars', v:fmt(f.sug)+'g', sub:1, d:1},
    {k:'pro', t:'Protein', v:fmt(f.pro)+'g', m:'pro', thick:1}
  ];
  let h = `<div class="nf" role="group" aria-label="Nutrition facts for ${f.name}">`;
  h += `<h4>Nutrition Facts</h4>`;
  h += `<div class="sv">${f.spc} servings per container<br><b>Serving size</b> ${f.serv}</div>`;
  h += `<div class="cal"><span>Calories</span><b>${cal(f)}</b></div>`;
  R.forEach(r=>{
    const cls = ['r'];
    if(r.sub) cls.push('sub'); if(r.ital) cls.push('ital');
    if(mode==='macro' && r.m) cls.push('mac', r.m);
    if(mode==='detail' && r.d) cls.push('det');
    const isClick = click.includes(r.k);
    if(isClick) cls.push('click');
    if(st.picked===r.k) cls.push('picked');
    if(st.wrong && st.wrong.includes(r.k)) cls.push('wrong');
    if(st.right===r.k) cls.push('right');
    const attrs = isClick ? ` role="button" tabindex="0" data-row="${r.k}" data-food="${key}"` : '';
    h += `<div class="${cls.join(' ')}"${attrs}><span><b>${r.t}</b> ${r.v}</span></div>`;
  });
  h += `<div class="fine">Practice label for classroom use.</div></div>`;
  return h;
}
function foodHead(key){ const f=F[key]; return `<div class="foodhead">${ico(f.icon)}<div><b>${f.name}</b><small>per ${f.serv}</small></div></div>`; }
function legend(kind){
  if(kind==='macro') return `<div class="legend" aria-label="Color key"><span class="fat">Total Fat row</span><span class="carb">Total Carbohydrate row</span><span class="pro">Protein row</span></div>`;
  return `<div class="legend"><span class="det">Blue rows = the details that matter second</span></div>`;
}

    ans = `<div class="opts">${s.opts.map(k=>{const no=s.no.includes(k);return `<button class="opt plain ${no?'no':''} ${s.finished&&k===q.ans?'yes':''}" data-act="s3w" data-k="${k}" ${no||s.finished?'disabled':''}>${ico(F[k].icon).replace('class="ico"','class="ico" style="width:38px;height:38px;flex:none"')}<b>${F[k].name}</b></button>`;}).join('')}</div>`;
  } else {
    ans = `<div class="opts">${s.opts.map((o,i)=>{const no=s.no.includes(i);return `<button class="opt plain ${no?'no':''} ${s.finished&&o.ok?'yes':''}" data-act="s3mc" data-i="${i}" ${no||s.finished?'disabled':''}>${esc(o.t)}</button>`;}).join('')}</div>`;
  }
  const last = s.i===s.list.length-1;
  app.innerHTML = `
    <h2>Stage 3: Label detective <small style="font-weight:400;font-size:.65em;color:var(--mute)">case ${s.i+1} of ${s.list.length}</small></h2>
    ${backBtn(3)}
    <p>Keep using the big three: Total Fat, Total Carbohydrate, and Protein. Now do some label math, and pick up a few extra facts along the way.</p>
    ${labels}
    <div class="card"><div class="q">${esc(q.q)}</div>${ans}
      <div class="tools"><button class="ghost" data-act="listen">Listen</button></div>
      <div class="fb" id="fb"></div>
      ${s.finished?`<p style="margin-top:14px"><button class="btn" data-act="s3next">${last?'Finish stage 3':'Next case'}</button></p>`:''}
    </div>`;
  if(s.finished){ fb(s.msg, s.msgCls); }
}
function s3Finish(ok){
  const s=S.s3,q=s.q; s.finished=true; S.done.s3++; updateProg();
  if(ok && s.tries===1) S.score.s3++;
  if(ok) celebrate();
  s.msg = (ok?'<b>Correct.</b> ':'<b>Here is the answer.</b> ')+q.why+(q.note?'<br><br><b>Good to know:</b> '+q.note:''); s.msgCls = ok?'good':'info';
  renderS3();
}
function s3Wrong(){ const s=S.s3,q=s.q;
  if(q.type==='num'){ renderS3(); fb('Not yet. <b>Hint:</b> '+q.hint,'bad'); }
  else { renderS3(); fb('Not quite. Re-read the Total Fat, Total Carbohydrate, and Protein rows and try again.','bad'); }
}
function s3Num(){
  const s=S.s3,q=s.q, v=document.getElementById('numAns').value;
  if(v==='') { fb('Type a number first.','info'); return; }
  s.tries++;
  if(Math.abs(parseFloat(v)-q.ans)<0.05) s3Finish(true);
  else if(s.tries>=3) s3Finish(false);
  else s3Wrong();
}
function s3Which(k){ const s=S.s3,q=s.q; s.tries++; if(k===q.ans) s3Finish(true); else { s.no.push(k); if(s.no.length>=q.foods.length-1) s3Finish(false); else s3Wrong(); } }
function s3MC(i){ const s=S.s3; s.tries++; if(s.opts[i].ok) s3Finish(true); else { s.no.push(i); if(s.no.length>=s.opts.length-1) s3Finish(false); else s3Wrong(); } }
function s3Next(){ const s=S.s3; if(s.i<s.list.length-1){s.i++;loadS3();} else renderStageEnd(3); }

/* ===================== STAGE END & SUMMARY ===================== */
function renderStageEnd(n){
  const key='s'+n, sc=S.score[key], mx=S.max[key];
  const msgs={1:'You can now read the three big numbers and use them as evidence.',2:'You matched macromolecules to what a body actually needs.',3:'You can turn label grams into Calories like a food scientist.'};
  app.innerHTML = `<div class="card" style="text-align:center;max-width:560px;margin:20px auto">
    <h2>Stage ${n} complete</h2>
    <p style="font-size:2rem;font-family:Rockwell,Georgia,serif;margin:0">${sc} / ${mx}</p>
    <p>points on the first try</p><p>${msgs[n]}</p>
    <button class="btn" data-act="map">Back to the stage map</button></div>`;
  window.scrollTo(0,0);
}
function renderSummary(){
  const tot = S.score.s1+S.score.s2+S.score.s3, mx = S.max.s1+S.max.s2+S.max.s3;
  const attempted = S.done.s1+S.done.s2+S.done.s3;
  const playedMax = (S.done.s1?S.max.s1:0)+(S.done.s2?S.max.s2:0)+(S.done.s3?S.max.s3:0);
  const pct = playedMax? Math.round(100*tot/playedMax):0;
  let rank, rc;
  if(!attempted){ rank='Not started yet'; rc='c-bear'; }
  else if(pct>=90){ rank='Master of Macros'; rc='c-lifter'; }
  else if(pct>=75){ rank='Label Reader'; rc='c-runner'; }
  else if(pct>=55){ rank='Trail Scout'; rc='c-biker'; }
  else { rank='Still Training'; rc='c-dog'; }
  const row=(t,k)=>`<div class="stat"><b>${t}</b><big>${S.done[k]?S.score[k]+' / '+S.max[k]:'Not played'}</big>first-try points</div>`;
  app.innerHTML = `
    <div class="showteacher" role="alert">SHOW TEACHER THIS SCREEN</div>
    <div class="rank"><div class="pic">${pic(rc)}</div><h2 style="color:#fff">${rank}</h2>
      <p style="margin:0;color:#dcebe6">${S.name?esc(S.name)+(S.hour?' · hour '+esc(S.hour):'')+' · ':''}${attempted} of ${TOTAL} challenges finished</p></div>
    <div class="sumgrid">
      ${row('Stage 1: Decode','s1')}${row('Stage 2: Fuel the client','s2')}${row('Stage 3: Label detective','s3')}
      <div class="stat"><b>Overall</b><big>${attempted?pct+'%':'--'}</big>of first-try points</div>
    </div>
    <div class="card"><h3>What to remember</h3>
      <ul style="margin:0 0 0 1.1em;padding:0">
        <li><b>Macromolecules first.</b> The biggest gram amount among Total Fat, Total Carbohydrate, and Protein tells you what the food is mostly made of.</li>
        <li><b>Lipids</b> = long-term energy, insulation (bear, sled dog). <b>Carbohydrates</b> = quick energy (runner, racer). <b>Proteins</b> = build and repair (bodybuilder).</li>
        <li><b>Calories:</b> fat has 9 per gram, carbohydrate and protein have 4 per gram.</li>
        <li><b>Extra label facts you met:</b> fiber and sugars are types of carbohydrate; saturated and trans are types of fat; cholesterol comes only from animals.</li>
      </ul></div>
    <p style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="map">Back to the stage map</button></p>
    <div class="hint">Your results are not saved or sent anywhere. Refreshing the page starts over.</div>`;
  window.scrollTo(0,0);
}


/* ===================== LOOK BACK (read-only review of earlier questions) ===================== */
function backBtn(n){
  const s=S['s'+n];
  return (s && s.i>0) ? `<div class="tools" style="margin:0 0 12px"><button class="ghost" data-act="back" data-st="${n}">&larr; Look at the previous question</button></div>` : '';
}
function openReview(n){ const s=S['s'+n]; S.review={stage:n, idx:s.i-1}; renderReview(); window.scrollTo(0,0); }
function renderReview(){
  const r=S.review, n=r.stage, s=S['s'+n], cur=s.i, total=s.list.length;
  let body='';
  if(n===1){
    const key=s.list[r.idx], f=F[key], d=domMacro(f), m=MACRO[d];
    const o={fat:f.fat,carb:f.carb,pro:f.pro};
    const others=['fat','carb','pro'].filter(k=>k!==d).map(k=>`${fmt(o[k])} g ${MACRO[k].row.toLowerCase().replace('total ','')}`);
    body=`<div class="row2"><div>${foodHead(key)}${labelHTML(key,{mode:'macro',state:{right:d}})}${legend('macro')}</div>
      <div class="card"><div class="q">Which macromolecule is the ${f.name.toLowerCase()} mostly made of?</div>
        <div class="fb good show"><b>${m.name}.</b> ${fmt(o[d])} g ${m.row.toLowerCase().replace('total ','')} beats ${others.join(' and ')}. The line with the biggest number is outlined on the label.<br><br><b>What ${m.name.toLowerCase()} does:</b> ${m.fn}</div></div></div>`;
  } else if(n===2){
    const m=s.list[r.idx], c=CAST[m.cast];
    const cards=m.opts.map(k=>`<div class="pickcard ${k===m.best?'yes':''}">${foodHead(k)}${labelHTML(k,{mode:'macro'})}${k===m.best?'<b>Best choice</b>':''}</div>`).join('');
    const notes=m.opts.map(k=>`<li><b>${F[k].name}:</b> ${m.notes[k]}</li>`).join('');
    body=`<div class="client"><div class="pic">${pic(c.svg)}</div><div><h2>${c.who}</h2><p>${m.story}</p></div></div>
      <div class="fb good show"><b>Needs most: ${MACRO[m.need].name}.</b> ${MACRO[m.need].fn}</div>
      <div class="compare">${cards}</div>
      <div class="card"><h3>Why each label did or did not fit</h3><ul style="margin:0 0 0 1.1em;padding:0">${notes}</ul></div>
      <div class="fb info show" style="margin-top:14px"><b>Good to know:</b> ${m.learn}</div>
      <div class="card" style="margin-top:14px"><div class="q">${m.bonus.q}</div><p><b>Answer:</b> ${esc(m.bonus.opts[0])}</p><p style="margin:0">${m.bonus.why}</p></div>`;
  } else {
    const q=s.list[r.idx];
    const labels=`<div class="compare" style="margin-top:0">${q.foods.map(k=>`<div class="pickcard" style="border-color:var(--line)">${foodHead(k)}${labelHTML(k,{mode:'macro'})}</div>`).join('')}</div>${legend('macro')}`;
    let ans = q.type==='num' ? q.ans+' '+q.unit : (q.type==='which' ? F[q.ans].name : q.opts[q.ans]);
    body=`${labels}<div class="card"><div class="q">${esc(q.q)}</div>
      <div class="fb good show"><b>Answer: ${esc(ans)}</b><br>${q.why}${q.note?'<br><br><b>Good to know:</b> '+q.note:''}</div></div>`;
  }
  const names={1:'Stage 1: Decode the label',2:'Stage 2: Fuel the client',3:'Stage 3: Label detective'};
  app.innerHTML=`
    <div class="fb info show" style="margin:0 0 14px"><b>Looking back.</b> You are reviewing question ${r.idx+1} of ${total}. Your score and progress are not changed.</div>
    <h2>${names[n]} <small style="font-weight:400;font-size:.65em;color:var(--mute)">question ${r.idx+1} of ${total}</small></h2>
    <div class="tools" style="margin:0 0 14px">
      <button class="ghost" data-act="rvprev" ${r.idx<=0?'disabled':''}>&larr; Earlier question</button>
      <button class="btn small" data-act="rvresume">Back to my question</button>
    </div>
    ${body}
    <p style="margin-top:16px"><button class="btn" data-act="rvresume">Back to my question</button></p>`;
}
function resumeStage(){
  const n=S.review.stage; S.review=null;
  if(n===1) renderS1(); else if(n===2) renderS2(); else renderS3();
  window.scrollTo(0,0);
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e=>{
  const row = e.target.closest('[data-row]');
  if(row){ s1Row(row.dataset.row); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  switch(a){
    case 'map':
      if(document.getElementById('nm')){ S.name=document.getElementById('nm').value.trim(); S.hour=document.getElementById('hr').value.trim(); }
      renderMap(); window.scrollTo(0,0); break;
    case 's1': startS1(); window.scrollTo(0,0); break;
    case 's2': startS2(); window.scrollTo(0,0); break;
    case 's3': startS3(); window.scrollTo(0,0); break;
    case 's1m': s1Macro(b.dataset.k); break;
    case 's1next': s1Next(); window.scrollTo(0,0); break;
    case 's2m': s2Macro(b.dataset.k); break;
    case 's2l': s2Label(b.dataset.k); break;
    case 's2b': s2Bonus(+b.dataset.i); break;
    case 's2next': s2Next(); window.scrollTo(0,0); break;
    case 's3num': s3Num(); break;
    case 's3w': s3Which(b.dataset.k); break;
    case 's3mc': s3MC(+b.dataset.i); break;
    case 's3next': s3Next(); window.scrollTo(0,0); break;
    case 'back': openReview(+b.dataset.st); break;
    case 'rvprev': if(S.review.idx>0){S.review.idx--; renderReview(); window.scrollTo(0,0);} break;
    case 'rvresume': resumeStage(); break;
    case 'summary': renderSummary(); break;
    case 'listen': listen(readText); break;
  }
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-row]')){ e.preventDefault(); s1Row(e.target.dataset.row); }
  if(e.key==='Enter' && e.target.id==='numAns'){ s3Num(); }
});

/* highlight-to-define */
const tip = document.getElementById('tip');
function hideTip(){ tip.style.display='none'; }
function checkSel(){
  const sel = window.getSelection(); if(!sel || sel.rangeCount===0){ hideTip(); return; }
  const t = sel.toString().trim().toLowerCase().replace(/[^a-z\s-]/g,'').replace(/\s+/g,' ');
  if(!t || t.length>30){ hideTip(); return; }
  let key = GLOSS[t]!==undefined ? t : (t.endsWith('s') && GLOSS[t.slice(0,-1)]!==undefined ? t.slice(0,-1) : null);
  if(!key){ hideTip(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  tip.innerHTML = '<b>'+key+'</b><br>'+GLOSS[key];
  tip.style.display='block';
  const w = tip.offsetWidth;
  let left = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  let top = r.bottom + 8; if(top + tip.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - tip.offsetHeight - 8);
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
document.addEventListener('mouseup', ()=>setTimeout(checkSel,10));
document.addEventListener('touchend', ()=>setTimeout(checkSel,350));
document.addEventListener('mousedown', e=>{ if(!tip.contains(e.target)) hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});


/* ===================== CALCULATOR ===================== */
(function(){
  const box=document.getElementById('calc'), btn=document.getElementById('calcBtn'), disp=document.getElementById('cdisp'), exp=document.getElementById('cexp');
  let cur='0', prev=null, op=null, fresh=true;
  const sym={'+':'+','-':'\u2212','*':'\u00d7','/':'\u00f7'};
  const show=()=>{ disp.textContent = cur.length>12 ? String(parseFloat(cur).toPrecision(10)) : cur; exp.textContent = (op&&prev!==null)? (fmtN(prev)+' '+sym[op]) : ''; };
  const fmtN=n=>String(parseFloat(Number(n).toPrecision(12)));
  function compute(a,b,o){ if(o==='+')return a+b; if(o==='-')return a-b; if(o==='*')return a*b; if(o==='/')return b===0?NaN:a/b; return b; }
  function press(k){
    if(/^[0-9]$/.test(k)){ if(fresh||cur==='0'||cur==='Error'){cur=k;} else if(cur.replace(/[-.]/g,'').length<12){cur+=k;} fresh=false; }
    else if(k==='.'){ if(fresh||cur==='Error'){cur='0.';fresh=false;} else if(!cur.includes('.')) cur+='.'; }
    else if(k==='C'){ cur='0'; prev=null; op=null; fresh=true; }
    else if(k==='B'){ if(fresh||cur==='Error'){cur='0';} else { cur=cur.length>1?cur.slice(0,-1):'0'; if(cur==='-')cur='0'; } }
    else if('+-*/'.includes(k)){
      if(cur==='Error') return;
      if(op&&prev!==null&&!fresh){ const r=compute(prev,parseFloat(cur),op); cur=isNaN(r)?'Error':fmtN(r); }
      prev = cur==='Error'?null:parseFloat(cur); op=k; fresh=true;
    }
    else if(k==='='){
      if(op&&prev!==null){ const r=compute(prev,parseFloat(cur),op); cur=isNaN(r)?'Error':fmtN(r); prev=null; op=null; fresh=true; }
    }
    show();
  }
  function setOpen(o){ box.classList.toggle('open',o); btn.setAttribute('aria-expanded',o); if(o){ box.querySelector('[data-k="1"]').focus(); } else btn.focus(); }
  btn.addEventListener('click',()=>setOpen(!box.classList.contains('open')));
  document.getElementById('calcClose').addEventListener('click',()=>setOpen(false));
  document.getElementById('ckeys').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(b) press(b.dataset.k); });
  box.addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='Escape'){ setOpen(false); return; }
    if(/^[0-9.+\-*\/]$/.test(k)){ e.preventDefault(); press(k); }
    else if(k==='Enter'||k==='='){ e.preventDefault(); press('='); }
    else if(k==='Backspace'){ e.preventDefault(); press('B'); }
    else if(k==='c'||k==='C'||k==='Delete'){ e.preventDefault(); press('C'); }
  });
  show();
})();

renderHome(); updateProg();
</script>
